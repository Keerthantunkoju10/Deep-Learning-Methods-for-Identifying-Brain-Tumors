# Netlify Configuration for NeuroScan AI - Brain Tumor Diagnostic Suite

[build]
  publish = "."

# Optimized headers for security and asset caching
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache sample MRI scans for fast instant loading
[[headers]]
  for = "/testImages/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# Static assets caching
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# Optional backend proxy: If you deploy the Python Flask backend on Render/Railway,
# uncomment these lines and replace with your backend URL.
# Netlify will automatically route API requests to your live Python server!
# [[redirects]]
#   from = "/api/*"
#   to = "https://your-flask-app.onrender.com/api/:splat"
#   status = 200
#   force = true
